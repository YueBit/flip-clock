<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<meta name="theme-color" content="#121110">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">

  <div class="board">
    <div class="board-inner">
      <div class="wrap" id="wrap">

        <div class="clock" id="clock" role="img" aria-label=""></div>

        <div class="info" id="info">
        <div class="date" id="date">&nbsp;</div>
        <div class="rule" id="rule"></div>

        <div class="meta">
          <span class="weather" id="weather" hidden>
            <span class="wicon" id="wicon"></span>
            <span class="wtemp" id="wtemp"></span>
            <span class="wdesc" id="wdesc"></span>
          </span>
          <span class="sep" id="sep" hidden>·</span>
          <span class="note" id="note"></span>
        </div>
        </div>

      </div>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <div class="dim" id="dim" aria-hidden="true"></div>
  <video class="awake" id="awake" src="keep-awake.mp4" muted loop playsinline webkit-playsinline autoplay preload="auto" aria-hidden="true"></video>
  <div class="sr-only" id="sr" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
