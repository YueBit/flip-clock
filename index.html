<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<meta name="theme-color" content="#121110">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">

  <div class="board">
    <div class="board-inner">
      <div class="wrap" id="wrap">

        <div class="clock" id="clock" role="img" aria-label=""></div>

        <div class="info" id="info">
        <div class="date" id="date">&nbsp;</div>
        <div class="rule" id="rule"></div>

        <div class="meta">
          <span class="weather" id="weather" hidden>
            <span class="wicon" id="wicon"></span>
            <span class="wtemp" id="wtemp"></span>
            <span class="wdesc" id="wdesc"></span>
          </span>
          <span class="sep" id="sep" hidden>·</span>
          <span class="followers" id="followers" hidden>
            <span class="ficon" id="ficon"></span><span class="fcount" id="fcount"></span><span class="flabel" id="flabel"></span>
          </span>
          <span class="sep2" id="sep2" hidden>·</span>
          <span class="quote" id="quote" hidden>
            <span class="qlabel" id="qlabel"></span><span class="qvalue" id="qvalue"></span><span class="qchange" id="qchange"></span>
          </span>
          <span class="sep3" id="sep3" hidden>·</span>
          <span class="note" id="note"></span>
        </div>
        </div>

      </div>
    </div>
  </div>

  <div class="box" id="box" aria-hidden="true">
    <div class="box-veil"></div>
    <div class="box-slot">
      <div class="box-card" id="boxcard">
        <span class="box-kicker" id="boxkicker">Music box</span>
        <div class="box-clock"><span class="box-hhmm" id="boxtime">--:--</span><span class="box-ss" id="boxsecs">--</span><span class="box-period" id="boxperiod"></span></div>
        <div class="box-when" id="boxwhen"></div>
        <div class="box-stage">
          <div class="box-case">
            <div class="box-well">
              <div class="box-drum"><div class="box-pins" id="boxpins"></div></div>
              <div class="box-comb" id="boxcomb"></div>
            </div>
          </div>
          <div class="box-key"><i></i></div>
        </div>
        <div class="box-foot">
          <span class="box-tune" id="boxtune">Music box</span>
          <span class="box-close" id="boxclose">Swipe across to close</span>
        </div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <div class="dim" id="dim" aria-hidden="true"></div>
  <video class="awake" id="awake" src="keep-awake.mp4" muted loop playsinline webkit-playsinline autoplay preload="auto" aria-hidden="true"></video>
  <div class="sr-only" id="sr" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="melody.js"></script>
  <script src="app.js"></script>
</body>
</html>
