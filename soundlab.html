<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flip clock — sound test</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #14120f;
    color: #e8e2d6;
    font-family: "Rajdhani", -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 4vh 5vw;
  }
  h1 {
    font-size: 3.4vh; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; margin: 0 0 1vh; color: #f2ecdf;
  }
  p.sub { margin: 0 0 4vh; color: #8d8474; font-size: 2.1vh; letter-spacing: 0.06em; }
  .row {
    display: block; width: 100%; text-align: left;
    background: #1d1a16; color: #e8e2d6;
    border: 1px solid #2e2923; border-radius: 10px;
    padding: 2.6vh 3vh; margin-bottom: 1.6vh;
    font: inherit; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .row:active, .row.on { background: #2a251e; border-color: #6b5f4a; }
  .name { font-size: 3vh; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .desc { font-size: 1.9vh; color: #9a9182; margin-top: 0.5vh; letter-spacing: 0.04em; }
  .now { margin-top: 3vh; color: #7c7364; font-size: 1.9vh; letter-spacing: 0.05em; }
  .hint { margin-top: 1vh; color: #6d6558; font-size: 1.7vh; }
</style>
</head>
<body>

<h1>Sound test</h1>
<p class="sub">Tap a row. Each one plays six seconds of its own tick and tock.</p>

<button class="row" data-set="flap"><span class="name">1 — Flap</span>
  <span class="desc">Cardboard flap, plastic case: soft release, then the clack.</span></button>
<button class="row" data-set="wood"><span class="name">2 — Wood</span>
  <span class="desc">Heavier case: darker, more body, less click.</span></button>
<button class="row" data-set="sharp"><span class="name">3 — Sharp</span>
  <span class="desc">Machined mechanism: short, dry, a little metal.</span></button>
<button class="row" data-set="soft"><span class="name">4 — Soft</span>
  <span class="desc">Quiet card in a wooden box: low and gentle.</span></button>

<div class="now" id="now">Currently on the clock: <b id="cur">—</b></div>
<div class="hint">Tell me the number and I'll make it the default.</div>

<script>
(function () {
  var buttons = document.querySelectorAll('.row');
  var cur = document.getElementById('cur');
  var timers = [];

  function stopAll() {
    for (var i = 0; i < timers.length; i++) { clearTimeout(timers[i]); clearInterval(timers[i]); }
    timers = [];
  }

  function playSet(set, row) {
    stopAll();
    for (var i = 0; i < buttons.length; i++) { buttons[i].className = 'row'; }
    if (row) { row.className = 'row on'; }

    var a = new Audio('sounds/' + set + '-tick.wav?v=2');
    var b = new Audio('sounds/' + set + '-tock.wav?v=2');
    a.preload = b.preload = 'auto';

    var n = 0;
    function beat() {
      var el = (n % 2 === 0) ? a : b;
      try { el.currentTime = 0; el.play(); } catch (e) { }
      n++;
      if (n < 8) { timers.push(setTimeout(beat, 1000)); }
      else { timers.push(setTimeout(function () { if (row) { row.className = 'row'; } }, 900)); }
    }
    beat();
  }

  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () { playSet(this.getAttribute('data-set'), this); };
  }

  var m = /[?&]sound=([a-z]+)/.exec(location.search);
  cur.textContent = m ? m[1] : 'flap';
})();
</script>
</body>
</html>
